spring.application.name=sitewatch
server.port=8080

# --- Database: defaults to in-memory H2; Docker Compose overrides these with MySQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sitewatch;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Actuator (used by Docker healthcheck) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

spring.thymeleaf.cache=false

# --- SiteWatch settings ---
sitewatch.scheduler.enabled=true
sitewatch.check.timeout-seconds=10
sitewatch.check.pool-size=10
sitewatch.min-interval-seconds=30
sitewatch.max-websites-per-user=25
sitewatch.retention-days=30
# false = block localhost/private IPs (SSRF protection). Compose sets true only for the local demo site.
sitewatch.allow-private-hosts=${SITEWATCH_ALLOW_PRIVATE_HOSTS:false}
sitewatch.alerts.email-enabled=${SITEWATCH_EMAIL_ALERTS:false}
sitewatch.alerts.from=${SITEWATCH_ALERT_FROM:alerts@sitewatch.local}
# To really send mail set: spring.mail.host, spring.mail.port, spring.mail.username, spring.mail.password
