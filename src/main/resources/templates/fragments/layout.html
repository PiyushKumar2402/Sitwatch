<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' - SiteWatch'">SiteWatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="topbar">
  <div class="container py-2 d-flex align-items-center justify-content-between">
    <a class="brand" th:href="@{/dashboard}"><span class="beat" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>SiteWatch</a>
    <div class="d-flex align-items-center gap-3">
      <span class="who" th:text="${username}">user</span>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button type="submit" class="btn btn-link btn-sm p-0">Sign out</button>
      </form>
    </div>
  </div>
</nav>
<div th:fragment="flash">
  <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>
</body>
</html>
