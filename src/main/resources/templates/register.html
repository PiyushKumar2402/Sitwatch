<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<main class="container">
  <div class="auth">
    <h1>Create your account</h1>
    <p class="tagline">Add your websites and SiteWatch starts checking them right away.</p>
    <div class="panel">
      <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
        <div class="mb-3"><label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" th:field="*{username}" autocomplete="username" required autofocus
                 th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{username}"></div></div>
        <div class="mb-3"><label class="form-label" for="email">Email <span class="muted fw-normal">(for downtime alerts, optional)</span></label>
          <input class="form-control" id="email" type="email" th:field="*{email}" autocomplete="email"
                 th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{email}"></div></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="new-password" required
                 th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
          <div class="invalid-feedback" th:errors="*{password}"></div>
          <div class="form-text">At least 8 characters.</div></div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
      </form>
    </div>
    <p class="mt-3 text-center">Already registered? <a th:href="@{/login}">Sign in</a></p>
  </div>
</main>
</body>
</html>
