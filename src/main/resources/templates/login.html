<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="container">
  <div class="auth">
    <h1>SiteWatch</h1>
    <p class="tagline">Know when your websites go down before your visitors do.</p>
    <div class="panel">
      <div class="alert alert-danger" th:if="${param.error}" role="alert">Wrong username or password.</div>
      <div class="alert alert-info" th:if="${param.logout}" role="status">You have been signed out.</div>
      <div class="alert alert-success" th:if="${param.registered}" role="status">Account created. Sign in to continue.</div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3"><label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div>
    <p class="mt-3 text-center">New here? <a th:href="@{/register}">Create an account</a></p>
  </div>
</main>
</body>
</html>
