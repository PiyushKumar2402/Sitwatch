name: sitewatch-jenkins

services:
  jenkins:
    build: .
    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"      # Jenkins UI -> http://localhost:8081
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
